<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheriff's Journal - West Mysteries</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" href="#3d2314">
</head>
<body>
    <div class="journal-container">
        <header class="journal-header">
            <span class="badge">⭐ Sceriffo di Oakhaven</span>
            <h1>Taccuino delle Indagini</h1>
        </header>

        <main id="game-screen">
            <div id="narrative-box"></div>
            <div id="interactive-area"></div>
            <div id="action-area"></div>
        </main>

        <footer class="journal-footer">
            <button id="btn-notebook" onclick="toggleNotes()">📜 Note e Stato</button>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
